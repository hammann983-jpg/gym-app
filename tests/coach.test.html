<!doctype html>
<meta charset="utf-8">
<title>Coach Test</title>
<body style="font-family:system-ui;padding:20px"><h1>Coach-Tests</h1><pre id="out">läuft…</pre>
<script src="../js/questionnaire.js"></script>
<script src="../js/plan.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/run.js"></script>
<script src="../js/multi.js"></script>
<script src="../js/coach.js"></script>
<script>
var res = [], fails = 0;
function ok(name, cond, info) { if (!cond) fails++; res.push((cond ? "OK   " : "FAIL ") + name + (cond ? "" : "  " + (info || ""))); }
function L(type, feel, date, extra) { return Object.assign({ type: type, feel: feel, date: date || "2026-11-20" }, extra || {}); }
function rv(state, log, o) { return Coach.review(state, Object.assign({ log: log, today: "2026-11-25" }, o || {})); }
fetch("../data/exercises.json", { cache: "no-cache" }).then(r => r.json()).then(function (d) {
  var EX = d.uebungen;
  var a = rv({}, [L("fb", "hard"), L("fb", "hard")]);
  ok("2x zu hart (Kraft): ein Satz weniger", a.state.sets === -1 && a.changed[0] === "gym_down" && a.state.endu === 1);
  ok("Keine zweite Änderung in derselben Woche", rv(a.state, [L("fb", "hard"), L("fb", "hard"), L("fb", "hard"), L("fb", "hard")]).changed.length === 0);
  ok("3x zu leicht (Ausdauer): +5 %", rv({}, [L("run", "easy"), L("run", "easy"), L("run", "easy")]).state.endu === 1.05);
  ok("2x leicht reicht nicht", rv({}, [L("run", "easy"), L("run", "easy")]).changed.length === 0);
  ok("Bei gelber Gesundheitsantwort nie steigern", rv({}, [L("run", "easy"), L("run", "easy"), L("run", "easy")], { light: true }).changed.length === 0);
  var p = rv({}, [L("run", "pain")]);
  ok("Schmerz: sofort weniger", p.state.endu === 0.9 && p.changed[0] === "endu_pain");
  ok("Nach Schmerz 14 Tage keine Steigerung", rv({}, [L("fb", "pain", "2026-11-18"), L("run", "easy"), L("run", "easy"), L("run", "easy")]).changed.indexOf("endu_up") < 0);
  var st = {}; for (var i = 0; i < 20; i++) st = Coach.review(st, { log: Array(i * 2 + 2).fill(L("run", "hard")), today: "2027-0" + (1 + Math.floor(i / 4)) + "-" + (1 + (i % 4) * 7 < 10 ? "0" : "") + (1 + (i % 4) * 7) }).state;
  ok("Grenzen: nie unter 80 %", st.endu >= 0.8, st.endu);
  var hxl = [L("run", "ok", "2026-11-10", { sport: "hyrox", st: 4, min: 40 }), L("run", "ok", "2026-11-24", { sport: "hyrox", st: 4, min: 37 })];
  var h = rv({}, hxl); ok("Hyrox schneller: mehr Stationen", h.state.hx === 1 && h.changed[0] === "hx_up" && h.state.history[0].info.pct === 8);
  ok("Hyrox: gleiches Ergebnis zählt nur einmal", rv(h.state, hxl, { today: "2026-12-10" }).changed.length === 0);
  ok("Hyrox andere Stationszahl wird nicht verglichen", rv({}, [hxl[0], L("run", "ok", "2026-11-24", { sport: "hyrox", st: 2, min: 20 })]).changed.length === 0);
  var item = Multi.hyrox({ hyrox_division: "open_frauen" }, 12, 2).weeks[0].runs[1];
  var more = Coach.applyRun(item, { hx: 1 }, i => Multi.station(i, "open_frauen"));
  ok("Hyrox Stufe +1: 5 Stationen", more.stations.length === 5 && more.q[0].n === 5 && item.stations.length === 4, more.stations.length);
  ok("Ausdauer 90 %: kürzer, Rennen bleibt", Coach.applyRun({ k: "easy", min: 50 }, { endu: 0.9 }).min === 45 && Coach.applyRun({ k: "long", km: 20 }, { endu: 0.9 }).km === 18 && Coach.applyRun({ k: "race", dist: "5k" }, { endu: 0.9 }).k === "race");
  var w1 = Coach.weightStep({}, { mode: "cut", state: "tooslow" }, -100, false, "2026-11-25");
  ok("Gewicht stagniert: zuerst Cardio, Kalorien unverändert", w1.state.cardio === 1 && w1.kcal === 0);
  var w2 = Coach.weightStep(w1.state, { mode: "cut" }, -100, false, "2026-12-10"), w3 = Coach.weightStep(w2.state, { mode: "cut" }, -100, false, "2026-12-25");
  ok("Danach zweites Cardio, erst dann Kalorien", w2.state.cardio === 2 && w3.kcal === -100 && w3.state.cardio === 2);
  ok("Zu schnell: Cardio wieder raus", Coach.weightStep(w2.state, { mode: "cut" }, 100, false, "2026-12-25").state.cardio === 1);
  ok("Mit Ausdauer-Plan nur Kalorien", Coach.weightStep({}, { mode: "cut" }, -100, true, "2026-11-25").kcal === -100);
  var u = Coach.undo(w3.state); ok("Rückgängig nimmt Kalorien zurück", u.kcal === 100);
  ok("Rückgängig nimmt Cardio zurück", Coach.undo(w1.state).state.cardio === 0);
  var prof = { ziele: ["triathlon"], tri_distanz: "olympisch", kraft_erfahrung: "m6_24", trainingstage: 5, dauer_min: 60, ort: "studio", verletzungen: ["keine"], s4: "ja" };
  ok("Screening erkennt Gelb", Q.screening(prof).yellow === true);
  [["triathlon"], ["marathon"], ["hyrox"], ["laufen"]].forEach(function (z) {
    var pl = Plan.generate(Object.assign({}, prof, { ziele: z, lauf_ziel: "hm", lauf_level: "ueber_30" }), EX, { today: new Date("2026-11-25T12:00:00") }), bad = [];
    for (var w = 1; w <= pl.weeks + 1; w++) Run.week(pl.run, w).runs.forEach(function (r) { if (["quality", "bikehard", "sim"].indexOf(r.k) >= 0) bad.push(w + r.k); (r.q || []).forEach(function (q) { if (["hybrid", "swim_endu"].indexOf(q.id) < 0) bad.push(w + q.id); }); });
    ok("Gelb " + z + ": keine Intervalle, kein Wettkampftempo", !bad.length && pl.light, bad.slice(0, 5).join());
  });
  var gp = Plan.generate(Object.assign({}, prof, { ziele: ["kraft"] }), EX);
  ok("Gelb Kraft: leichtes Schema, höchstens 3 Sätze, mindestens 8 Wiederholungen", gp.light && gp.sessions.every(s => s.exercises.every(x => x.sets <= 3 && (x.timed || x.bodyweight || x.lo >= 8))));
  var bp = { ziele: ["muskelaufbau"], kraft_erfahrung: "ueber_24", trainingstage: 4, dauer_min: 60, ort: "studio", verletzungen: ["keine"], alter: 30, schlaf: "m7_9" };
  var sets = p => p.sessions.reduce((n, s) => n + s.exercises.reduce((m, x) => m + x.sets, 0), 0);
  var normal = Plan.generate(bp, EX), tired = Plan.generate(Object.assign({}, bp, { schlaf: "unter_5" }), EX), old = Plan.generate(Object.assign({}, bp, { alter: 65 }), EX), young = Plan.generate(Object.assign({}, bp, { alter: 16 }), EX);
  ok("Wenig Schlaf: weniger Sätze", sets(tired) < sets(normal) && tired.notes.indexOf("sleep") >= 0);
  ok("Ab 60: eine Stufe tiefer", old.level === "fortgeschritten" && normal.level === "erfahren" && old.notes.indexOf("age60") >= 0);
  ok("Unter 18: leichter Plan", young.light && young.notes.indexOf("teen") >= 0 && young.goal === "fitness");
  var goalsig = ["kraft", "muskelaufbau", "fitness"].map(g => { var p = Plan.generate(Object.assign({}, bp, { ziele: [g] }), EX), x = p.sessions[0].exercises.filter(e => e.compound && !e.bodyweight && !e.timed)[0]; return x.lo + "-" + x.hi + "/" + x.rest; });
  ok("Ziele ergeben verschiedene Vorgaben", new Set(goalsig).size === 3, goalsig.join(" "));
  var cp = Object.assign({}, bp, { ziele: ["abnehmen"], groesse_cm: 170, gewicht_kg: 70 }), pl = Plan.generate(cp, EX), c1 = Plan.cardio(cp, pl, 1, 0), c9 = Plan.cardio(cp, pl, 9, 0);
  ok("Abnehmen: 3x Cardio, wird länger", c1.count === 3 && c1.min === 25 && c9.min === 35 && c1.fat);
  var mp = Plan.generate(bp, EX), cm = Plan.cardio(bp, mp, 1, 0);
  ok("Muskelaufbau: 2x 20 Min. locker", cm.count === 2 && cm.min === 20 && !cm.fat);
  var at = mp.sessions.map((s, i) => Plan.cardioAt(bp, mp, 1, 0, i) ? s.type : null).filter(Boolean);
  ok("Cardio an Oberkörper-Tagen", at.join() === "ok,ok", at.join());
  ok("Coach: mehr Cardio, mehr Einheiten oder länger", Plan.cardio(cp, pl, 1, 1).count === 4 && Plan.cardio(cp, pl, 1, 2).min === 30);
  var kn = Object.assign({}, cp, { verletzungen: ["knie"] }), ck = Plan.cardio(kn, Plan.generate(kn, EX), 5, 0);
  ok("Knie: sanft, kaum Steigung", ck.gentle && ck.incline === 1 && ck.kmh === 4.5);
  var yo = Object.assign({}, cp, { alter: 16 }); ok("Unter 18: kein Fettabbau-Cardio", !Plan.cardio(yo, Plan.generate(yo, EX), 1, 0).fat);
  var rp = Object.assign({}, bp, { ziele: ["marathon"] }); ok("Ausdauer-Plan: kein Extra-Cardio", Plan.cardio(rp, Plan.generate(rp, EX), 1, 0) === null);
  ok("Adhärenz", Coach.adherence([L("fb", null, "2026-11-01"), L("fb", null, "2026-11-20")], 3, "2026-11-25").low === true && Coach.adherence([L("fb", null, "2026-11-20")], 3, "2026-11-25") === null);
  document.getElementById("out").textContent = (fails ? fails + " FEHLER" : "ALLE " + res.length + " TESTS GRÜN") + "\n\n" + res.join("\n");
}).catch(e => { document.getElementById("out").textContent = "FEHLER " + e.stack; });
</script>
